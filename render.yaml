services:
  - type: web
    name: blissmark-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: node dist/main.js
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DEV_OTP
        value: "482193"
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_API_URL
        value: https://blissmark-api.onrender.com/v1
      - key: MONGODB_URI
        sync: false
